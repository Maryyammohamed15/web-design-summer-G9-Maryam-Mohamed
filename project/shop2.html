<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop 2</title>

     <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <!--Hero Section-->
        <section class="shop2-hero">
            <img src="images/parallax-04-1536x1024.jpg" alt="Shop 2">
            <div class="shop2-hero-content">
                <h1>Shop 2</h1>
            </div>

        </section>
             <!-----Section 2----->
        <section class="products">

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-03.jpg" alt="Chalet">
            <span class="sale">SALE!</span>
        </div>
        <h2>Chalet</h2>
        <p class="price">
            <span class="old-price">$35.60</span>
            <span>$30.50</span>
        </p>
        <button>SELECT OPTIONS</button>
    </div>

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-05.jpg" alt="Double Room">
            <span class="sale">SALE!</span>
        </div>
        <h2>Double Room</h2>
          <p class="price">
            <span class="old-price">$32.90</span>
            <span>$28.90</span>
        </p>
        <button>SELECT OPTIONS</button>
    </div>

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-07.jpg" alt="Family Room">
        </div>
        <h2>Family Room</h2>
        <p>$34.80</p>
        <button>SELECT OPTIONS</button>
    </div>

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-02.jpg" alt="Garden Room">
        </div>
        <h2>Garden Room</h2>
        <p>$45.60</p>
        <button>SELECT OPTIONS</button>
    </div>


    <div class="product-card">
        <div class="product-image">
            <img src="images/square-05.jpg" alt="Lake View">
            <span class="sale">SALE!</span>
        </div>
        <h2>Lake View</h2>
          <p class="price">
            <span class="old-price">$19.80</span>
            <span>$15.50</span>
        </p>
        <button>SELECT OPTIONS</button>
    </div>

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-08.jpg" alt="Mini Apt."> 
        </div>
        <h2>Mini Apt.</h2>
        <p>$45.70</p>
        <button>SELECT OPTIONS</button>
    </div>

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-01.jpg" alt="Sea Room">
        </div>
        <h2>Sea Room</h2>
        <p>$37.20</p>
        <button>SELECT OPTIONS</button>
    </div>

    <div class="product-card">
        <div class="product-image">
            <img src="images/square-04.jpg" alt="VIP Suite">
        </div>
        <h2>VIP Suite</h2>
        <p>$26.80</p>
        <button>SELECT OPTIONS</button>
    </div>

</section>
    </main>
</body>
</html>
